name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run autoplay
      # The MCP server in `wrangler dev` (local, no Cloudflare account) called over MCP, then the
      # deck player in a stand-in host.
      - run: npm run smoke
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: autoplay-shots
          path: |
            packages/deck/dist/shots/
            packages/server/dist/shots/
          if-no-files-found: ignore
